[project]
name = "google-search-console-mcp"
version = "0.1.0"
description = "A local-first Google Search Console MCP execution layer."
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.169.0",
  "google-auth>=2.40.0",
  "google-auth-oauthlib>=1.2.2",
  "mcp>=1.24.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
